<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC | Índice de Massa Corporal</title>
</head>
<body>
    <h1>IMC | Índice de Massa Corporal</h1>
    <form action="/imc" method="POST">
        <label for="nome">Nome:</label><br>
        <input type="text" name="nome" required><br><br>
        <label for="massa">Massa muscular em kg:</label><br>
        <input type="number" step="0.01" name="massa" required><br><br>
        <label for="altura">Altura em metros:</label><br>
        <input type="number" step="0.01" name="altura" required><br><br>
        <button type="submit">Calcular</button>
    </form>
    <hr>
    <marquee>
        <h2>{{ result if result else "" }}</h2>
    </marquee>
</body>
</html>
