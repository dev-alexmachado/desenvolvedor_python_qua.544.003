<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POLTERGIT | Automatizador de Git</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/fontes.css') }}">
  </head>
  <body class="bg-dark" data-bs-theme="dark">
    <main class="container vh-100 d-flex align-items-center justify-content-center">
        <section class="row">
            <figure class="d-flex justify-content-center mb-3">
                <img src="{{ url_for('static', filename='img/ghost_logo.png') }}" alt="Fantasma Logo">
            </figure>
            <div class="d-flex justify-content-center mb-5">
                <h1>POLTERGIT</h1>
            </div>
            <form action="/commitar" method="POST">
                <div class="col-12">
                    <input type="text" placeholder="Informe o diretório do repositório" class="form-control" name="repositorio" required>
                </div>
                <div class="d-flex justify-content-center mt-5">
                    <button type="submit" class="btn btn-dark border border-dark-subtle col-4">
                        <b>Commitar e fazer push</b>
                    </button>
                </div>
            </form>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
